name: fs7_gym_app
description: "FS-7 Gym App - Staff management app for iOS and Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # Local Notifications
  flutter_local_notifications: ^17.2.2

  # Charts
  fl_chart: ^0.68.0

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.1

  # File / Image
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.3

  # Signature
  syncfusion_flutter_signaturepad: ^26.2.14

  # UI & Utilities
  cached_network_image: ^3.3.1
  intl: any
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  uuid: ^4.4.2
  connectivity_plus: ^6.0.3
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
